name: R5S P0208 PC Premerge Proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Knowledge GREEN
        uses: actions/checkout@v7
        with:
          repository: sierraglobalcompany-rgb/CarpiNova-Knowledge
          ref: 70f61d9bb9a53d04a4ef78aa78faab263d7ab80d
          path: knowledge

      - name: Checkout exact PC main
        uses: actions/checkout@v7
        with:
          repository: sierraglobalcompanyv2/CarpiNova-PC
          ref: 0dfd1131ce01be2a4ed4b429ead2d4e214db1472
          path: pc

      - name: Verify immutable inputs
        run: |
          test "$(git -C knowledge rev-parse HEAD)" = "70f61d9bb9a53d04a4ef78aa78faab263d7ab80d"
          test "$(git -C pc rev-parse HEAD)" = "0dfd1131ce01be2a4ed4b429ead2d4e214db1472"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - name: Install Knowledge dependencies
        working-directory: knowledge
        run: uv sync --all-groups

      - name: Install PC dependencies
        working-directory: pc
        run: npm ci

      - name: Prepare exact Knowledge GREEN
        working-directory: pc
        run: node scripts/prepare-knowledge.mjs --knowledge-root ../knowledge

      - name: Verify installed P0208 FIG001 contract
        working-directory: pc
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile('generated/knowledge/manifest.json', 'utf8'));
          const bundle = JSON.parse(await readFile('generated/knowledge/figures.bundle.json', 'utf8'));
          if (manifest.knowledge_version !== '1.2.0') throw new Error('unexpected Knowledge version');

          const figure = bundle.figures.find((item) => item.figure_id === 'FIG-CPNC-2025-P0208-001');
          if (!figure) throw new Error('P0208 FIG001 missing');
          if (figure.page_id !== 'PAGE-CPNC-2025-P0208') throw new Error('page id mismatch');
          if (figure.type !== 'dimensioned_drawing') throw new Error('figure type mismatch');
          if (figure.reconstruction?.render_contract !== 'normalized-2d-v1') throw new Error('render contract mismatch');
          if (figure.reconstruction?.deterministic_required !== true) throw new Error('deterministic flag mismatch');
          if (figure.reconstruction?.generative_image_allowed !== false) throw new Error('generative flag mismatch');

          const normalized = (value) => typeof value === 'number' && value >= 0 && value <= 1;
          const expectedPrimitives = new Map([
            ['door-leaf', 'rect'],
            ['internal-frame', 'rect'],
            ['door-skin', 'rect'],
            ['lock', 'polyline'],
          ]);
          if (figure.entities?.length !== expectedPrimitives.size) throw new Error('entity count mismatch');
          const entities = new Map(figure.entities.map((entity) => [entity.id, entity]));
          for (const [id, primitive] of expectedPrimitives) {
            const entity = entities.get(id);
            if (!entity) throw new Error(`missing entity ${id}`);
            if (entity.geometry?.primitive !== primitive || entity.geometry?.precision !== 'approximate') throw new Error(`geometry contract mismatch ${id}`);
            if ('dimensions' in entity.geometry || 'bbox' in entity.geometry) throw new Error(`metric inference field present ${id}`);
            if (primitive === 'rect') {
              const b = entity.geometry?.bounds;
              if (!b || !normalized(b.x) || !normalized(b.y) || typeof b.width !== 'number' || b.width <= 0 || typeof b.height !== 'number' || b.height <= 0 || b.x + b.width > 1 || b.y + b.height > 1) throw new Error(`bounds mismatch ${id}`);
            } else {
              const points = entity.geometry?.points;
              if (!Array.isArray(points) || points.length < 2 || points.some((p) => !normalized(p.x) || !normalized(p.y))) throw new Error(`polyline mismatch ${id}`);
            }
          }

          const expectedMeasurements = [
            'MEAS-CPNC-2025-P0208-001',
            'MEAS-CPNC-2025-P0208-002',
            'MEAS-CPNC-2025-P0208-003',
            'MEAS-CPNC-2025-P0208-004',
            'MEAS-CPNC-2025-P0208-005',
          ];
          if (JSON.stringify(figure.measurements) !== JSON.stringify(expectedMeasurements)) throw new Error('measurement contract mismatch');

          const expectedRelationships = [
            ['internal-frame', 'door-leaf', 'inside'],
            ['door-skin', 'internal-frame', 'covers'],
            ['lock', 'door-leaf', 'installed_on'],
          ];
          if (figure.relationships?.length !== expectedRelationships.length) throw new Error('relationship count mismatch');
          for (let i = 0; i < expectedRelationships.length; i += 1) {
            const [from, to, type] = expectedRelationships[i];
            const rel = figure.relationships[i];
            if (rel?.from !== from || rel?.to !== to || rel?.type !== type) throw new Error(`relationship mismatch ${i}`);
          }

          const expectedAnnotations = new Map([
            ['ann-door-thickness', ['door-leaf', 'Espesor puerta estándar 36 mm']],
            ['ann-lock-position', ['lock', '90 cm desde piso; 6 cm desde canto']],
          ]);
          if (figure.annotations?.length !== expectedAnnotations.size) throw new Error('annotation count mismatch');
          for (const annotation of figure.annotations) {
            const expected = expectedAnnotations.get(annotation.id);
            if (!expected) throw new Error(`unexpected annotation ${annotation.id}`);
            const [target, text] = expected;
            if (annotation.target_entity_id !== target || annotation.text !== text) throw new Error(`annotation semantics mismatch ${annotation.id}`);
            if (annotation.placement?.precision !== 'approximate' || !normalized(annotation.placement?.x) || !normalized(annotation.placement?.y)) throw new Error(`annotation placement mismatch ${annotation.id}`);
          }

          const expectedLayers = [
            ['geometry', 10, ['door-leaf', 'internal-frame', 'door-skin', 'lock'], []],
            ['labels', 20, [], ['ann-door-thickness', 'ann-lock-position']],
          ];
          if (figure.layers?.length !== expectedLayers.length) throw new Error('layer count mismatch');
          for (let i = 0; i < expectedLayers.length; i += 1) {
            const [id, order, entityIds, annotationIds] = expectedLayers[i];
            const layer = figure.layers[i];
            if (layer?.id !== id || layer?.order !== order) throw new Error(`layer identity mismatch ${i}`);
            if (JSON.stringify(layer.entity_ids ?? []) !== JSON.stringify(entityIds)) throw new Error(`layer entity refs mismatch ${id}`);
            if (JSON.stringify(layer.annotation_ids ?? []) !== JSON.stringify(annotationIds)) throw new Error(`layer annotation refs mismatch ${id}`);
          }

          if (figure.camera?.coordinate_space !== 'normalized_figure') throw new Error('camera mismatch');
          const viewport = figure.camera?.viewport;
          if (!viewport || viewport.x !== 0 || viewport.y !== 0 || viewport.width !== 1 || viewport.height !== 1) throw new Error('viewport mismatch');

          const notes = figure.review?.notes ?? '';
          if (!notes.includes('no codifica escala física')) throw new Error('non-metric guardrail missing');
          if (!notes.includes('bastidor interno') || !notes.includes('conceptual')) throw new Error('internal frame conceptual guardrail missing');
          if (!notes.includes('no muestra un corte abierto')) throw new Error('source-view guardrail missing');

          console.log(JSON.stringify({
            knowledge_version: manifest.knowledge_version,
            figure_id: figure.figure_id,
            render_contract: figure.reconstruction.render_contract,
            entities: figure.entities.length,
            annotations: figure.annotations.length,
            measurements: figure.measurements.length,
            relationships: figure.relationships.length,
            layers: figure.layers.length,
          }));
          NODE

      - name: Run PC tests
        working-directory: pc
        run: npm test

      - name: Typecheck
        working-directory: pc
        run: npm run typecheck

      - name: Build
        working-directory: pc
        run: npm run build

      - name: Audit dependencies
        working-directory: pc
        run: npm audit
