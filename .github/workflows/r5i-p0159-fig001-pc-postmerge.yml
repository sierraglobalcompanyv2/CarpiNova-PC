name: R5I P0159 FIG001 PC Postmerge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  postmerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged Knowledge main
        uses: actions/checkout@v7
        with:
          repository: sierraglobalcompany-rgb/CarpiNova-Knowledge
          ref: a425e4f34bb56ed1a49a4659ee6ae408115e1753
          path: knowledge

      - name: Checkout exact PC main
        uses: actions/checkout@v7
        with:
          repository: sierraglobalcompanyv2/CarpiNova-PC
          ref: 8996b9b874119de007347f10f003dbeea8aaf742
          path: pc

      - name: Verify immutable inputs
        run: |
          test "$(git -C knowledge rev-parse HEAD)" = "a425e4f34bb56ed1a49a4659ee6ae408115e1753"
          test "$(git -C pc rev-parse HEAD)" = "8996b9b874119de007347f10f003dbeea8aaf742"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - name: Install Knowledge dependencies
        working-directory: knowledge
        run: uv sync --all-groups

      - name: Install PC dependencies
        working-directory: pc
        run: npm ci

      - name: Prepare exact merged Knowledge
        working-directory: pc
        run: node scripts/prepare-knowledge.mjs --knowledge-root ../knowledge

      - name: Verify installed P0159 FIG001 contract
        working-directory: pc
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('generated/knowledge/manifest.json', 'utf8'));
          const bundle = JSON.parse(await readFile('generated/knowledge/figures.bundle.json', 'utf8'));
          if (manifest.knowledge_version !== '1.2.0') throw new Error('unexpected Knowledge version');
          const figure = bundle.figures.find((item) => item.figure_id === 'FIG-CPNC-2025-P0159-001');
          if (!figure) throw new Error('P0159 FIG001 missing');
          if (figure.reconstruction?.render_contract !== 'normalized-2d-v1') throw new Error('render contract mismatch');
          if (figure.reconstruction?.deterministic_required !== true) throw new Error('deterministic flag mismatch');
          if (figure.reconstruction?.generative_image_allowed !== false) throw new Error('generative flag mismatch');
          if (!Array.isArray(figure.measurements) || figure.measurements.length !== 0) throw new Error('measurements mismatch');
          if (figure.entities?.length !== 2 || !figure.entities.every((entity) => entity.geometry?.primitive === 'rect' && entity.geometry?.precision === 'approximate')) throw new Error('entity geometry mismatch');
          const labels = new Set(figure.annotations?.map((annotation) => annotation.text));
          if (!labels.has('Corte longitudinal') || !labels.has('Corte transversal') || labels.size !== 2) throw new Error('annotation semantics mismatch');
          console.log(JSON.stringify({knowledge_version: manifest.knowledge_version, figure_id: figure.figure_id, render_contract: figure.reconstruction.render_contract, entities: figure.entities.length, annotations: figure.annotations.length, measurements: figure.measurements.length}));
          NODE

      - name: Run PC tests
        working-directory: pc
        run: npm test

      - name: Typecheck
        working-directory: pc
        run: npm run typecheck

      - name: Build
        working-directory: pc
        run: npm run build

      - name: Audit dependencies
        working-directory: pc
        run: npm audit
