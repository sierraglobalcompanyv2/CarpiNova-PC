name: Knowledge Consumer Proof

on:
  workflow_dispatch:
    inputs:
      knowledge_sha:
        description: Exact 40-character CarpiNova-Knowledge commit SHA
        required: true
        type: string
      pc_sha:
        description: Exact 40-character CarpiNova-PC commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate immutable inputs
        shell: bash
        env:
          KNOWLEDGE_SHA: ${{ inputs.knowledge_sha }}
          PC_SHA: ${{ inputs.pc_sha }}
        run: |
          [[ "$KNOWLEDGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "knowledge_sha must be a full commit SHA"; exit 1; }
          [[ "$PC_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "pc_sha must be a full commit SHA"; exit 1; }

      - name: Checkout exact PC commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pc_sha }}
          path: pc
          fetch-depth: 1

      - name: Checkout exact Knowledge commit
        uses: actions/checkout@v7
        with:
          repository: sierraglobalcompany-rgb/CarpiNova-Knowledge
          ref: ${{ inputs.knowledge_sha }}
          path: knowledge
          fetch-depth: 1

      - name: Verify immutable checkouts
        shell: bash
        env:
          KNOWLEDGE_SHA: ${{ inputs.knowledge_sha }}
          PC_SHA: ${{ inputs.pc_sha }}
        run: |
          actual_pc="$(git -C pc rev-parse HEAD)"
          actual_knowledge="$(git -C knowledge rev-parse HEAD)"
          [[ "${actual_pc,,}" == "${PC_SHA,,}" ]] || { echo "PC checkout mismatch: $actual_pc"; exit 1; }
          [[ "${actual_knowledge,,}" == "${KNOWLEDGE_SHA,,}" ]] || { echo "Knowledge checkout mismatch: $actual_knowledge"; exit 1; }
          echo "PC_SHA=$actual_pc"
          echo "KNOWLEDGE_SHA=$actual_knowledge"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install PC dependencies
        working-directory: pc
        run: npm ci

      - name: Install Knowledge dependencies
        working-directory: knowledge
        run: uv sync --all-groups

      - name: Prepare canonical real Knowledge bundle
        working-directory: pc
        run: npm run knowledge:prepare -- --knowledge-root ../knowledge

      - name: Test PC
        working-directory: pc
        run: npm test

      - name: Typecheck PC
        working-directory: pc
        run: npm run typecheck

      - name: Build PC with real Knowledge
        working-directory: pc
        run: npm run build

      - name: Audit PC dependencies
        working-directory: pc
        run: npm audit

      - name: Verify production build contains exact generated Knowledge
        working-directory: pc
        shell: bash
        run: |
          files=(
            manifest.json
            knowledge.bundle.json
            figures.bundle.json
            lessons.bundle.json
          )
          for file in "${files[@]}"; do
            test -f "generated/knowledge/$file"
            test -f "dist/knowledge/$file"
            cmp "generated/knowledge/$file" "dist/knowledge/$file"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(
            fs.readFileSync('generated/knowledge/manifest.json', 'utf8'),
          );
          console.log(JSON.stringify({
            knowledge_version: manifest.knowledge_version,
            book_id: manifest.book_id,
            scope: manifest.scope,
            counts: manifest.counts,
          }, null, 2));
          NODE
